services:
  api:
    build: .
    container_name: nvg_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nvg_db
    restart: unless-stopped
    environment:
      SA_PASSWORD: ${SA_PASSWORD:?SA_PASSWORD is required}
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    container_name: nvg_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  landing:
    build:
      context: ./landing
    container_name: nvg_landing
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sql_data:
